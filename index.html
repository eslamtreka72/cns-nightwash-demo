:root{--cream:#fff8f8;--copper:#ed2817;--brown:#9d291e;--ink:#302526;--muted:#786768;--line:rgba(174,42,31,.14);--glass:rgba(255,255,255,.65);--accent:#d52214;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:#fff3f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 5%,#ffccc6 0,transparent 48%),radial-gradient(ellipse at 0 48%,#ffe3e0 0,transparent 44%),linear-gradient(135deg,#fffafa,#fff0ee);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;color:inherit;background:rgba(255,255,255,.65);padding:10px 15px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--copper);outline-offset:3px}button:hover{filter:brightness(.97)}.app{max-width:1120px;margin:auto;padding:22px 24px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:65px;height:65px;object-fit:contain;background:white;border-radius:19px;padding:5px}.brand b{font:700 24px Arial,sans-serif;letter-spacing:1px}.brand b span{font-size:16px;letter-spacing:0;color:var(--brown);margin-inline-start:6px}small{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}.quiet{background:transparent;font-size:12px;border:1px solid var(--line)}.notice{font-size:11px;line-height:1.9;color:var(--brown);margin:17px 0;border:1px solid var(--line);padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.4)}main{padding-bottom:22px}.eyebrow{color:var(--brown);font-size:11px;letter-spacing:.4px;margin:0 0 10px}h1{font-size:29px;line-height:1.5;margin:0 0 8px;font-weight:500;letter-spacing:-1px}h2{font-size:17px;margin:0;font-weight:600}p{font-size:13px;line-height:1.9;margin:8px 0}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0 22px}.primary{color:white;background:lin function seed(){return {bookings:[

{id:'CNS-002',customer:'عميل تجريبي ٢',compound:'Lake View',team:'T2',start:'2026-11-23T21:00',minutes:45,amount:250,status:'تم',stage:7},
{id:'CNS-003',customer:'عميل تجريبي ٣',compound:'Emaar Mivida',team:'T3',start:'2026-11-23T21:30',minutes:45,amount:250,status:'جارٍ',stage:3},

{id:'CNS-005',customer:'عميل تجريبي ٥',compound:'Swan Lake',team:'T2',start:'2026-11-24T00:15',minutes:45,amount:300,status:'مؤكد',stage:0},

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>nf.format(n)+' ج.م',teamName=id=>TEAM.find(t=>t.id===id)?.name||'غير محدد',paid=id=>state.payments.filter(p=>p.booking===id).reduce((n,p)=>n+p.amount,0),due=b=>b.status==='ملغي'?0:Math.max(0,b.amount-paid(b.id));

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
function time(v){return v.slice(11,16)}function dateLabel(v){return v.slice(8,10)+'/'+v.slice(5,7)}
function badge(s){return `<span class="badge ${s==='تم'?'done':s==='ملغي'?'cancel':''}">${esc(s)}</span>`}
function stats(){const done=state.bookings.filter(b=>b.status==='تم'),active=state.bookings.filter(b=>b.status!=='ملغي');return [{label:'حجوزات ليلة التشغيل',value:nf.format(active.length),note:'بدون الحجوزات الملغاة'},{label:'قيمة الخدمات المنفذة',value:money(done.reduce((s,b)=>s+b.amount,0)),note:'لا تشمل الحجوزات القادمة'},{label:'إجمالي التحصيل',value:money(state.payments.reduce((s,p)=>s+p.amount,0)),note:'يشمل العربون، ليس ربحًا'},{label:'متبقي على المنفذ',value:money(done.reduce((s,b)=>s+due(b),0)),note:'مستحقات خدمات انتهت'}]}
function metricHtml(){return `<div class="stats">${stats().map(s=>`<article class="glass stat"><label>${s.label}</label><strong>${s.value}</strong><small>${s.note}</small></article>`).join('')}</div>`}
function hero(title,sub,button=''){return `<section class="hero"><div><p class="eyebrow">CNS / CARWASH NIGHT SHIFT</p><h1>${title}</h1><p class="muted">${sub}</p></div>${button}</section>`}
function nextRows(){return state.bookings.filter(b=>!['تم','ملغي'].includes(b.status)).sort((a,b)=>a.start.localeCompare(b.start))}
function home(){return hero('كل وردية، تحت السيطرة.','ليلة تشغيل تجريبية: ٢٣ نوفمبر ٢٠٢٦، حتى فجر اليوم التالي.',`<button class="primary" data-action="add">+ حجز تجريبي</button>`)+metricHtml()+`<div class="grid"><section class="glass"><div class="section-head"><h2>على جدول الليلة</h2><button class="linkbtn" data-go="bookings">كل الحجوزات ←</button></div>${nextRows().slice(0,4).map(b=>`<div class="row"><div><strong>${esc(b.compound)}</strong><small>${esc(b.customer)} · ${teamName(b.team)} · ${dateLabel(b.start)}</small></div><div><span class="time">${time(b.start)}</span><small>${badge(b.status)}</small></div></div>`).join('')||'<p class="empty">كل خدمات الليلة انتهت.</p>'}<p class="subtle">مدة الخدمة التجريبية ٤٥ دقيقة. وقت الانتقال غير محسوب.</p></section><section class="glass"><div class="section-head"><h2>الفرق والإنجاز</h2><span class="badge">٣ فرق تجريبية</span></div>${TEAM.map(t=>{const all=state.bookings.filter(b=>b.team===t.id&&b.status!=='ملغي'),done=all.filter(b=>b.status==='تم').length;return `<div class="barrow"><div class="barlabel"><span>${t.name}</span><span>${nf.format(done)} / ${nf.format(all.length)} خدمات</span></div><div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div>`}).join('')}<p class="subtle">الوردية ٨ مساءً إلى٣ صباحًا. لا تتبع موقع أو حضور فعلي.</p></section></div>`}
function bookings(){return hero('الحجوزات','خطوات الخدمة من إعلان CNS المرفق. الأسعار والأسماء وهمية.',`<button class="primary" data-action="add">+ حجز تجريبي</button>`)+`<div class="filters"><input id="search" aria-label="بحث" placeholder="ابحث برقم الحجز أو العميل" value="${esc(filter)}"><select id="status-filter" aria-label="حالة الحجز">${['الكل','مؤكد','جارٍ','تم','ملغي'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select><select id="compound-filter" aria-label="الكمبوند">${['الكل',...COMPOUNDS].map(s=>`<option ${s===compoundFilter?'selected':''}>${s}</option>`).join('')}</select></div><div class="booking-grid" id="booking-list">${bookingList()}</div>`}
function bookingList(){const list=state.bookings.filter(b=>(statusFilter==='الكل'||b.status===statusFilter)&&(compoundFilter==='الكل'||b.compound===compoundFilter)&&(b.id+' '+b.customer).toLowerCase().includes(filter.toLowerCase()));return list.map(b=>`<article class="glass booking"><div class="section-head"><span class="listid">${b.id}</span>${badge(b.status)}</div><h2>${esc(b.compound)}</h2><p class="muted">${esc(b.customer)}</p><div class="meta"><span>${teamName(b.team)}</span><span class="time">${dateLabel(b.start)} · ${time(b.start)}</span></div><span class="stage-chip">${esc(STAGES[b.stage])}</span><div class="money"><span>القيمة <b>${money(b.amount)}</b></span><span>المتبقي <b>${money(due(b))}</b></span></div><button data-edit="${b.id}">تفاصيل وتحديث المرحلة</button></article>`).join('')||'<div class="glass empty">مفيش حجز بالاختيارات دي. غيّر البحث أو الفلتر.</div>'}
function team(){return hero('الفرق والورديات','كل وردية لها بداية ونهاية بالتاريخ، حتى لو عدّت منتصف الليل.')+`<div class="booking-grid">${TEAM.map(t=>`<article class="glass"><div class="schedule-title"><div class="avatar">${t.id.slice(1)}</div><div><h2>${t.name}</h2><small>${t.person}</small></div></div><div class="row"><span>بداية الوردية</span><span class="time">23/11 · 20:00</span></div><div class="row"><span>نهاية الوردية</span><span class="time">24/11 · 03:00</span></div><div class="row"><span>حجوزات غير ملغاة</span><strong>${nf.format(state.bookings.filter(b=>b.team===t.id&&b.status!=='ملغي').length)}</strong></div><p class="hint">تجربة لفريق بعامل واحد. الحضور والأجور وتعديل الورديات مش مفعّلين.</p></article>`).join('')}</div><p class="hint">إضافة الحجز تتحقق من الوردية وتداخل مواعيد الفريق. وقت التنقل بين الكمبوندات يحتاج تخطيطًا منفصلًا.</p>`}
function payments(){return hero('التحصيل، من غير لخبطة.','دفعات تجريبية مرتبطة بكل حجز. مفيش بوابة دفع أو تحويل فلوس.',`<button class="primary" data-action="pay">+ تسجيل تحصيل</button>`)+metricHtml()+`<div class="ledger"><section class="glass"><h2>آخر الدفعات التجريبية</h2>${state.payments.slice().reverse().map(p=>`<div class="row"><div><strong>${money(p.amount)}</strong><small>${p.booking} · ${p.method}</small></div><span class="badge done">مسجل محليًا</span></div>`).join('')}</section><section class="glass"><h2>متبقي على الحجوزات</h2>${state.bookings.filter(b=>due(b)>0).map(b=>`<div class="row"><div><strong>${esc(b.customer)}</strong><small>${b.id} · ${esc(b.compound)}</small></div><strong>${money(due(b))}</strong></div>`).join('')||'<p>لا توجد مستحقات.</p>'}<p class="subtle">المتبقي على المؤكد مش إيراد منفذ. الإلغاء بعد التحصيل يحتاج رد مبلغ، وهو غير مدعوم هنا.</p></section></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===current));$('#main').innerHTML=({home,bookings,team,payments}[current])();if(memoryOnly)$('.notice').textContent='معاينة مؤقتة • بيانات وهمية • الحفظ على الجهاز غير متاح';bind()}
function field(label,name,type='text',value='',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`}
function options(label,name,items,value=''){return `<label class="field">${label}<select name="${name}">${items.map(i=>{const v=typeof i==='string'?i:i.value,l=typeof i==='string'?i:i.label;return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`}
function openModal(type,id=''){modalType=type;editing=id;$('#error').textContent='';$('#submit').hidden=false;$('#fields').innerHTML='';$('#modal-title').textContent=type==='add'?'حجز تجريبي جديد':type==='pay'?'تسجيل مبلغ وهمي':type==='reset'?'إعادة البيانات التجريبية':'تفاصيل الحجز';if(type==='add')$('#fields').innerHTML=`<p class="hint">اكتب اسمًا وهميًا، مش بيانات عميل حقيقي. مدة ثابتة٤٥دقيقة.</p>${field('اسم تجريبي','customer','text','','maxlength="40"')}${options('الكمبوند','compound',COMPOUNDS)}${options('الفريق','team',TEAM.map(t=>({value:t.id,label:t.name})))}${field('بداية الخدمة','start','datetime-local','2026-11-23T23:30')}${field('قيمة افتراضية بالجنيه','amount','number',200,'min="1" max="100000" step="0.01"')}`;
if(type==='pay'){const eligible=state.bookings.filter(b=>due(b)>0&&b.status!=='ملغي');if(!eligible.length){$('#fields').innerHTML='<p>مفيش حجوزات عليها متبقي.</p>';$('#submit').hidden=true}else $('#fields').innerHTML=options('الحجز','booking',eligible.map(b=>({value:b.id,label:b.id+' · متبقي '+money(due(b))})))+field('مبلغ وهمي بالجنيه','amount','number',50,'min="0.01" step="0.01"')+options('طريقة التسجيل','method',['نقدي','تحويل'])+'<p class="hint">التسجيل محلي فقط، مفيش خصم أو إيصال مالي حقيقي.</p>'}
if(type==='edit'){const b=state.bookings.find(x=>x.id===id);$('#fields').innerHTML=`<p>${esc(b.customer)} · ${esc(b.compound)}</p><p class="hint">${b.id} · ${dateLabel(b.start)} ${time(b.start)} · ${teamName(b.team)}</p>`+options('الحالة','status',['مؤكد','جارٍ','تم','ملغي'],b.status)+options('مرحلة التنفيذ','stage',STAGES.map((s,i)=>({value:i,label:s})),b.stage)+`<p class="hint">المدفوع ${money(paid(b.id))}. الإلغاء بوجود دفعات غير مدعوم لحماية تسوية المبلغ.</p>`}
if(type==='reset'){$('#fields').innerHTML='<p>هتتمسح التغييرات التجريبية على هذا الجهاز وترجع البيانات الأصلية. مفيش بيانات شركة حقيقية هنا.</p>';$('#submit').textContent='نعم، إعادة التجربة'}else $('#submit').textContent='حفظ تجريبي';$('#modal').showModal()}
function overlaps(a,b){const startA=new Date(a.start).getTime(),startB=new Date(b.start).getTime();return startA<startB+b.minutes*60000&&startB<startA+a.minutes*60000}
function validateBooking(b){if(!b.customer.trim()||b.customer.length>40)throw Error('اكتب اسمًا تجريبيًا حتى٤٠حرفًا.');if(!COMPOUNDS.includes(b.compound)||!TEAM.some(t=>t.id===b.team))throw Error('اختيار غير صالح.');if(!Number.isFinite(b.amount)||b.amount<=0||b.amount>100000||Math.abs(b.amount*100-Math.round(b.amount*100))>1e-6)throw Error('راجع المبلغ وخليه حتى خانتين عشريتين.');const t=TEAM.find(t=>t.id===b.team),start=new Date(b.start).getTime(),end=start+b.minutes*60000;if(!Number.isFinite(start)||start<new Date(t.from).getTime()||end>new Date(t.to).getTime())throw Error('اختار موعدًا داخل وردية٢٣نوفمبر٨مساءً إلى٢٤نوفمبر٣صباحًا.');if(state.bookings.some(x=>x.id!==b.id&&x.team===b.team&&x.status!=='ملغي'&&overlaps(x,b)))throw Error('الفريق عنده حجز متداخل. اختار موعدًا أو فريقًا تاني.');}
$('#form').addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{if(modalType==='add'){const b={id:'CNS-'+String(Math.max(...state.bookings.map(x=>Number(x.id.split('-')[1])))+1).padStart(3,'0'),customer:f.customer.trim(),compound:f.compound,team:f.team,start:f.start,amount:Number(f.amount),minutes:45,status:'مؤكد',stage:0};validateBooking(b);state.bookings.push(b)}else if(modalType==='pay'){const b=state.bookings.find(x=>x.id===f.booking),amount=Number(f.amount);if(!b||b.status==='ملغي'||!Number.isFinite(amount)||amount<=0||amount>due(b)||Math.abs(amount*100-Math.round(amount*100))>1e-6)throw Error('المبلغ لازم يكون أكبر من صفر وما يزيدش عن المتبقي، حتى خانتين عشريتين.');state.payments.push({id:'P-'+String(state.payments.length+1).padStart(3,'0'),booking:b.id,amount,method:f.method})}else if(modalType==='edit'){const b=state.bookings.find(x=>x.id===editing);if(f.status==='ملغي'&&paid(b.id)>0)throw Error('فيه تحصيل على الحجز. الإلغاء يحتاج تسوية ورد مبلغ خارج نطاق النموذج.');if(b.status==='ملغي'&&f.status!=='ملغي')validateBooking({...b,status:f.status});b.status=f.status;b.stage=f.status==='تم'?7:Number(f.stage)}else if(modalType==='reset')state=seed();save();$('#modal').close();render();toast('تم حفظ التغيير التجريبي على نفس الجهاز.')}catch(err){$('#error').textContent=err.message}});
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openModal(b.dataset.action));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal('edit',b.dataset.edit));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;render()});if($('#search'))$('#search').oninput=e=>{filter=e.target.value;$('#booking-list').innerHTML=bookingList();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal('edit',b.dataset.edit))};if($('#status-filter'))$('#status-filter').onchange=e=>{statusFilter=e.target.value;render()};if($('#compound-filter'))$('#compound-filter').onchange=e=>{compoundFilter=e.target.value;render()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})});$('#close').onclick=()=>$('#modal').close();$('#reset').onclick=()=>openModal('reset');render();
