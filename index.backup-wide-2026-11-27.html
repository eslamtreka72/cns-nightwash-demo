:root{--cream:#fff8f8;--copper:#ed2817;--brown:#9d291e;--ink:#302526;--muted:#786768;--line:rgba(174,42,31,.14);--glass:rgba(255,255,255,.65);--accent:#d52214;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:#fff3f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 5%,#ffccc6 0,transparent 48%),radial-gradient(ellipse at 0 48%,#ffe3e0 0,transparent 44%),linear-gradient(135deg,#fffafa,#fff0ee);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;color:inherit;background:rgba(255,255,255,.65);padding:10px 15px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--copper);outline-offset:3px}button:hover{filter:brightness(.97)}.app{max-width:1120px;margin:auto;padding:22px 24px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:65px;height:65px;object-fit:contain;background:white;border-radius:19px;padding:5px}.brand b{font:700 24px Arial,sans-serif;letter-spacing:1px}.brand b span{font-size:16px;letter-spacing:0;color:var(--brown);margin-inline-start:6px}small{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}.quiet{background:transparent;font-size:12px;border:1px solid var(--line)}.notice{font-size:11px;line-height:1.9;color:var(--brown);margin:17px 0;border:1px solid var(--line);padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.4)}main{padding-bottom:22px}.eyebrow{color:var(--brown);font-size:11px;letter-spacing:.4px;margin:0 0 10px}h1{font-size:29px;line-height:1.5;margin:0 0 8px;font-weight:500;letter-spacing:-1px}h2{font-size:17px;margin:0;font-weight:600}p{font-size:13px;line-height:1.9;margin:8px 0}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0 22px}.primary{color:white;background:lin return hero('لوحة الإدارة الشاملة','كل الكمبوندات في شاشة واحدة، مع ترتيب ومقارنة بين الفترات.',`<select data-set="ownP"><option value="week" ${ownP==='week'?'selected':''}>أسبوع</option><option value="month" ${ownP==='month'?'selected':''}>شهر</option><option value="year" ${ownP==='year'?'selected':''}>سنة</option></select>`)+`<div class="stats">${stat('إجمالي العملاء',N(A.n),N(rows.length)+' كمبوندات')}${stat('إجمالي السيارات',N(A.cars),'')}${stat('الإيرادات',money(all.r),T[4])}${stat('المصروفات',money(all.e),'غير شاملة العمالة')}${stat('تكلفة العمالة',money(all.lab),'')}${stat('صافي الربح',money(all.net),(pct(all.net,allp.net)>=0?'+':'')+N(pct(all.net,allp.net))+'% عن الفترة السابقة')}</div><div class="grid"><section class="glass"><h2>الأكثر ربحية</h2>${rk('p',r=>r.f.net)}<h3>الأكثر مشتركين</h3>${rk('n',r=>r.a.n,null,v=>N(v)+' عميل')}</section><section class="glass"><h2>الأكثر مصروفات</h2>${rk('e',r=>r.f.e+r.f.lab)}<h3>مقارنة الأداء (${T[4]} مقابل الفترة السابقة)</h3>${rows.map(r=>`<div class="row"><div><strong>${esc(r.c.name)}</strong><small>الآن ${money(r.f.r)} · قبل ${money(r.p.r)}</small></div><b class="${r.f.r<r.p.r?'neg':''}">${pct(r.f.r,r.p.r)>=0?'+':''}${N(pct(r.f.r,r.p.r))}%</b></div>`).join('')}</section></div>`}
function repData(){const T=PER(repP),a=T[0],b=T[1],f=fin(repC,repP),p=fin(repC,repP,true);const nc=state.customers.filter(c=>(repC==='all'||c.comp===repC)&&inR(c.start,a,b)),lc=state.customers.filter(c=>(repC==='all'||c.comp===repC)&&c.end&&inR(c.end,a,b));const days=Object.keys(state.runs).filter(d=>inR(d,a,b)),prod=state.workers.filter(w=>repC==='all'||w.comp===repC).map(w=>({w,n:days.reduce((s,d)=>s+Object.values(state.runs[d]).filter(r=>r.by===w.id&&r.s==='تم الغسيل').length,0)}));return{T,f,p,nc,lc,prod}}

cust(d){openCust(d.id)},stmt(d){stmt(d.id)},pay(d){recPay(d.id)},
newcust(){openM('عميل جديد',`<div class="two">${fld('الاسم','name','','text','required')}${fld('الهاتف','phone','','tel')}</div><div class="two">${fld('الفيلا / الشقة','unit','')}${sel('الكمبوند','comp',state.comps.map(c=>[c.id,c.name]))}</div>${fld('سعر السيارة شهريًا','price',650,'number')}<div class="three">${fld('نوع السيارة','t','')}${fld('اللون','c','')}${fld('اللوحة','p','')}</div>`,{submit:'إضافة العميل',onSubmit:f=>{if(!f.name.trim())throw Error('اكتب الاسم');const c={id:nid('k'),name:f.name.trim(),phone:f.phone,unit:f.unit,comp:f.comp,price:Number(f.price)||650,cars:[{id:nid('v'),type:f.t||'سيارة',color:f.c,plate:f.p,state:'نشط',since:TODAY}],cycleStart:TODAY,auto:true,start:TODAY,end:'',status:'نشط',adj:[],notes:''};state.customers.unshift(c);log('إضافة عميل '+c.name);toast('اتضاف العميل')}})},
