:root{--cream:#fff8f8;--copper:#ed2817;--brown:#9d291e;--ink:#302526;--muted:#786768;--line:rgba(174,42,31,.14);--glass:rgba(255,255,255,.65);--accent:#d52214;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:#fff3f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 5%,#ffccc6 0,transparent 48%),radial-gradient(ellipse at 0 48%,#ffe3e0 0,transparent 44%),linear-gradient(135deg,#fffafa,#fff0ee);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;color:inherit;background:rgba(255,255,255,.65);padding:10px 15px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--copper);outline-offset:3px}button:hover{filter:brightness(.97)}.app{max-width:1120px;margin:auto;padding:22px 24px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:65px;height:65px;object-fit:contain;background:white;border-radius:19px;padding:5px}.brand b{font:700 24px Arial,sans-serif;letter-spacing:1px}.brand b span{font-size:16px;letter-spacing:0;color:var(--brown);margin-inline-start:6px}small{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}.quiet{background:transparent;font-size:12px;border:1px solid var(--line)}.notice{font-size:11px;line-height:1.9;color:var(--brown);margin:17px 0;border:1px solid var(--line);padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.4)}main{padding-bottom:22px}.eyebrow{color:var(--brown);font-size:11px;letter-spacing:.4px;margin:0 0 10px}h1{font-size:29px;line-height:1.5;margin:0 0 8px;font-weight:500;letter-spacing:-1px}h2{font-size:17px;margin:0;font-weight:600}p{font-size:13px;line-height:1.9;margin:8px 0}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0 22px}.primary{color:white;background:lin .chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}.chip{font-size:11px;padding:7px 12px;border-radius:99px;background:#ffffff50;border:1px solid #fff9;color:#4a2a22}.chip.active{background:#fff;font-weight:700}
.modbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;cursor:pointer;border:1px solid #ffffffb0;text-align:right;font-size:14px}.modbtn span{font-size:26px}
.stat[data-a],.row[data-a]{cursor:pointer}.neg{color:#b3261e!important}
.carbox{border:1px solid #7a3f2e22;border-radius:16px;padding:10px;margin:10px 0}h3{font-size:14px;margin:16px 0 6px}
.ph{display:flex;gap:8px;margin-top:8px}.ph img{width:70px;height:70px;object-fit:cover;border-radius:12px}.ph i{width:70px;height:70px;border-radius:12px;background:#ffffff70;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal}
.tblw{overflow:auto}.tbl{border-collapse:collapse;width:100%;font-size:11px}.tbl th,.tbl td{padding:7px 5px;border-bottom:1px solid #7a3f2e1c;text-align:center}.tbl td:first-child{text-align:right}
.chk{display:flex!important;align-items:center;gap:8px;margin-top:30px!important}.chk input{width:auto;margin:0}
textarea{width:100%;border-radius:16px;border:1px solid #fffb;background:#ffffff40;padding:12px;font:inherit;color:#4a2a22;margin-top:8px}
dialog{width:min(94vw,560px)}dialog .field input,dialog .field select{width:100%}
#login{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,#f6dccd,#dba995 60%,#c98f78)}#login[hidden]{display:none}
.lcard{width:min(92vw,380px);text-align:center}.lcard img{width:74px;height:74px;border-radius:20px;margin-bottom:6px}.lcard .field{text-align:right}.err{color:#b3261e;font-size:12px;min-height:16px}
body.locked .app{visibility:hidden}
.stmt .row{padding:9px 0}
@media print{.app>header,.app>nav,nav,#optics,canvas,#login,#opening,#toast,.app>main,footer,.notice{display:none!important}.app{display:block!important;visibility:visible!important}dialog[open]{position:static!important;display:block!important;width:100%!important;max-height:none!important;box-shadow:none!important;transform:none!important}#close,#submit,.btnrow{display:none!important}body{background:#fff!important}}
.stat strong{font-size:21px!important;white-space:nowrap}.modbtn svg{color:#7a3f2e}
